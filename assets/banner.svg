<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="250" cy="200" r="120" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="950" cy="150" r="80" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Decorative circuit lines -->
  <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M0 350 Q 200 300 400 340 Q 600 380 800 320 Q 1000 260 1200 300"/>
    <path d="M0 50 Q 300 100 500 40 Q 700 -20 900 60 Q 1100 140 1200 80"/>
  </g>

  <!-- Dots at intersections -->
  <g fill="url(#accent)" opacity="0.6">
    <circle cx="400" cy="340" r="3"/>
    <circle cx="800" cy="320" r="3"/>
    <circle cx="500" cy="40" r="3"/>
    <circle cx="900" cy="60" r="3"/>
  </g>

  <!-- Left decorative element: interconnected nodes -->
  <g transform="translate(80, 120)">
    <circle cx="40" cy="40" r="8" fill="none" stroke="#667eea" stroke-width="2" opacity="0.7"/>
    <circle cx="100" cy="20" r="6" fill="none" stroke="#764ba2" stroke-width="2" opacity="0.7"/>
    <circle cx="80" cy="80" r="5" fill="none" stroke="#667eea" stroke-width="1.5" opacity="0.5"/>
    <line x1="40" y1="40" x2="100" y2="20" stroke="#667eea" stroke-width="1" opacity="0.4"/>
    <line x1="40" y1="40" x2="80" y2="80" stroke="#764ba2" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="20" x2="80" y2="80" stroke="#667eea" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Main text -->
  <text x="600" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">BRANDON BENNETT</text>

  <!-- Accent line -->
  <rect x="450" y="155" width="300" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a0a0c0" text-anchor="middle" letter-spacing="1.5">Forward Deployed Engineer · Pursuit Fellow</text>

  <!-- Project tags -->
  <g transform="translate(350, 230)">
    <!-- OmniRoute tag -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="none" stroke="#667eea" stroke-width="1.5" opacity="0.8"/>
    <text x="110" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#667eea" text-anchor="middle" font-weight="600">⚡ OmniRoute</text>

    <!-- Obsidian Sync tag -->
    <rect x="240" y="0" width="260" height="36" rx="18" fill="none" stroke="#764ba2" stroke-width="1.5" opacity="0.8"/>
    <text x="370" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#764ba2" text-anchor="middle" font-weight="600">💎 Obsidian Sync</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6b6b8d" text-anchor="middle">Building tools that make AI accessible to everyone</text>

  <!-- Right decorative element: sync arrows -->
  <g transform="translate(950, 250)" opacity="0.5">
    <path d="M0 30 Q 30 0 60 30 Q 30 60 0 30" fill="none" stroke="#667eea" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="4" fill="#764ba2"/>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="395" width="1200" height="5" fill="url(#accent)" opacity="0.8"/>
</svg>
